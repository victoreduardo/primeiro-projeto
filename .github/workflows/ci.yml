name: HTML Code Analysis Pipeline

on:
  push:
    branches: [ main, development ]
    paths:
      - '**.html'
      - '**.htm'
  pull_request:
    branches: [ main ]
    paths:
      - '**.html'
      - '**.htm'

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: HTML Validation
      run: |
        npm install -g html-validator-cli
        find . -name "*.html" -exec html-validator --file {} --verbose \;

    - name: HTML Best Practices Analysis
      run: |
        npm install -g htmlhint
        htmlhint "**/*.html"

    - name: Performance Analysis
      run: |
        npm install -g lru-cache
        echo "lru-cache installed successfully."

    - name: Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        security-checks: 'vuln,config,secret'
        ignore-unfixed: true
        format: 'table'
        output: 'trivy-results.txt'

    - name: Upload Analysis Reports
      uses: actions/upload-artifact@v4
      with:
        name: analysis-reports
        path: |
          accessibility-reports/
          lighthouse/
          trivy-results.txt

    - name: Create Issue on Failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.name,
            title: 'HTML Analysis Failed',
            body: 'Analysis pipeline detected issues. Please review the attached reports.'
          })
